[project]
name = "stock-metrics"
version = "0.1.0"
description = "Historical fundamental metrics and charts for US-listed stocks"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.20",
    "pydantic>=2.6",
    "requests>=2.31",
    "streamlit>=1.40",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pandas-stubs", "pytest>=8.0", "ruff>=0.5", "types-requests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
packages = ["stock_metrics"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that call live external APIs (deselect with -m 'not network')"]
